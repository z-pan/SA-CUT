# Ablation: CUT Baseline (no mask input, standard PatchNCE)
# Inherits all unspecified keys from default.yaml at runtime.
# Changes vs default: input_nc=1, no mask, lambda_struct=0, lambda_idt=0, standard PatchNCE.

experiment:
  name: ablation_cut_baseline

generator:
  input_nc: 1                      # TPAF only — no mask channel
  mask_injection: none             # mask not injected

losses:
  lambda_struct: 0.0               # L_struct disabled
  lambda_idt: 0.0                  # identity loss disabled for fair comparison
  # Standard PatchNCE (not region-aware) — implemented via sa_patchnce with mask=None
  struct_warmup_epochs: 0          # irrelevant, struct is off
  struct_rampup_epochs: 0
