# SA-CUT Default Configuration
# All hyperparameters for Structure-Anchored Contrastive Unpaired Translation
# Override specific keys via CLI: --config configs/default.yaml --set training.batch_size=2

experiment:
  name: sa_cut_default
  # Format: {method}_{date}_{note}, e.g. sa_cut_20260317_baseline
  log_dir: results/logs
  checkpoint_dir: checkpoints
  save_freq: 10         # save checkpoint every N epochs
  log_freq: 100         # log metrics every N iterations
  vis_freq: 500         # save sample images every N iterations
  use_wandb: false
  use_tensorboard: true

# ------------------------------------------------------------
# Data
# ------------------------------------------------------------
data:
  tpaf_dir: data/raw/tpaf          # directory of TPAF patches / WSI files
  he_dir: data/raw/he              # directory of H&E patches / WSI files
  patch_size: 512
  tpaf_channels: 1                 # 1 (grayscale) or 2 (NADH + FAD)
  # TPAF normalization: percentile clipping [p_low, p_high] then scale to [0, 1]
  tpaf_norm_percentile_low: 1.0
  tpaf_norm_percentile_high: 99.0
  he_norm_range: [-1, 1]           # H&E normalized to [-1, 1] for generator output
  num_workers: 4
  pin_memory: true
  augment: true

# ------------------------------------------------------------
# Mask provider (frozen — never trained during SA-CUT)
# mode: precomputed  → load pre-saved binary/soft mask .npy/.png files
# mode: cellpose     → run Cellpose-SAM at training time (slower, no pre-save step)
# ------------------------------------------------------------
mask_provider:
  mode: precomputed                # precomputed | cellpose_sam
  mask_dir: data/patches/masks     # used when mode=precomputed
  cellpose_checkpoint: checkpoints/cellpose_sam_tpaf.pth  # used when mode=cellpose_sam
  # model_type must match the checkpoint architecture:
  #   cpsam   → Cellpose-SAM (SAM backbone, filenames start with 'cpsam_*')
  #   cyto3   → classic Cellpose U-Net  (incompatible with cpsam checkpoints)
  #   nuclei  → classic Cellpose nucleus model
  cellpose_model_type: cpsam
  cellpose_diameter: 78            # scaled from 30 (unscaled) × 127.44/48.81 = 78 (SA-CUT patches)
  cellpose_flow_threshold: 0.85
  cellpose_cellprob_threshold: 0.0
  cellpose_gpu: true
  output_type: binary              # binary | soft (probability map)
  # Mask dtype at runtime must be float32 in [0, 1]
  binarize_threshold: 0.5          # threshold applied when output_type=binary
  log_mask_stats: true             # log coverage ratio & component stats each epoch

# ------------------------------------------------------------
# Generator
# ------------------------------------------------------------
generator:
  input_nc: 2                      # TPAF (1ch) + Mask (1ch); set 3 for NADH+FAD+Mask
  output_nc: 3                     # RGB H&E output
  ngf: 64
  n_resnet_blocks: 9
  norm_type: instance              # instance (required for batch_size=1)
  use_dropout: false
  mask_injection: early_fusion     # early_fusion | multi_scale
  init_type: normal                # normal | xavier | kaiming | orthogonal
  init_gain: 0.02

# ------------------------------------------------------------
# Discriminator
# ------------------------------------------------------------
discriminator:
  input_nc: 3
  ndf: 64
  n_layers: 3
  norm_type: instance
  use_spectral_norm: true            # SN on all conv layers; replaces IN for D stability
  init_type: normal
  init_gain: 0.02

# ------------------------------------------------------------
# Losses
# ------------------------------------------------------------
losses:
  lambda_adv: 1.0
  lambda_patchnce: 1.0
  lambda_struct: 5.0               # high — structure preservation is the core contribution
  lambda_idt: 0.5                  # identity loss; set 0.0 to disable
  gan_mode: lsgan                  # lsgan | vanilla | wgangp
  n_patchnce_layers: 5             # encoder layers from which to sample NCE patches
  n_patches_per_layer: 256
  struct_loss_mode: luminance        # luminance (robust) | threshold (HED-based)
  # Thresholding for struct_loss_mode: luminance (inverted grayscale, dark=nuclear)
  struct_threshold_luminance: 0.5    # inverted-gray value above which pixel is nuclear
  # Thresholding for struct_loss_mode: threshold (HED H-channel)
  struct_threshold_hematoxylin: 0.1  # H-channel value above which pixel is nuclear
  struct_sharpness: 20.0             # sigmoid steepness (shared by both modes)
  # Warm-up: L_struct is disabled for the first N epochs
  struct_warmup_epochs: 3            # luminance mode works early; shorter warm-up suffices
  # Linear ramp-up of lambda_struct over N epochs after warm-up ends
  struct_rampup_epochs: 5
  # R1 gradient penalty on D: complementary to spectral norm.
  # With SN as primary D stabiliser, R1 serves as a secondary safeguard.
  lambda_r1: 1.0
  # Colour statistics matching: pushes generated mean/std toward real H&E
  lambda_color: 5.0                  # match channel-wise mean + std of real H&E
  color_stats_momentum: 0.01         # EMA update rate for running statistics
  color_stats_warmup: 50             # batches before L_color activates
  # Colour loss mode:
  #   global — match whole-image channel mean/std (ColorStatsLoss). Degenerate
  #            minimum is uniform pink; kept as ablation baseline.
  #   region — match mean/std per nuclear / cytoplasm / background region
  #            (RegionColorStatsLoss). Gives eosin a spatial colour anchor.
  color_loss_mode: global            # global | region
  color_std_weight: 1.0              # weight of the per-region std term (β)
  color_w_nuclear: 1.0               # region loss multiplier: nuclei (hematoxylin)
  color_w_cytoplasm: 1.5             # region loss multiplier: cytoplasm (eosin, under-supervised)
  color_w_background: 0.5            # region loss multiplier: background (white)
  color_white_threshold: 0.8         # real-side luminance above which non-nuclear = white bg
  color_tpaf_fg_threshold: 0.1       # gen-side TPAF above which non-nuclear = cytoplasm
  color_region_sharpness: 10.0       # sigmoid steepness for soft bg/fg region partition
  color_min_region_mass: 4.0         # skip a region whose pixel mass < this in a batch

# ------------------------------------------------------------
# Training
# ------------------------------------------------------------
training:
  batch_size: 1
  lr_G: 2.0e-4
  lr_D: 1.0e-4                       # half of lr_G — slows D to prevent collapse
  beta1: 0.5
  beta2: 0.999
  n_epochs: 200                    # epochs at full LR (Phase 1+2)
  n_epochs_decay: 200              # epochs for linear LR decay to 0 (Phase 3)
  seed: 42
  # Mixed precision training
  use_amp: false
  # Gradient clipping (0 = disabled)
  grad_clip_norm: 0.0
  # How many D steps per G step
  d_steps_per_g: 1
  # D update gating (0 = disabled). Skips D's gradient step while EMA(loss_D) is
  # below the threshold, i.e. while D is winning. Set it BELOW the gan_mode's
  # equilibrium loss (lsgan: 0.25, vanilla: 0.693) -- a threshold above
  # equilibrium can never be satisfied and freezes D permanently.
  d_loss_gate_threshold: 0.0
  d_loss_gate_ema_momentum: 0.05

# ------------------------------------------------------------
# Evaluation (run after training or on-the-fly)
# ------------------------------------------------------------
evaluation:
  fid_real_dir: data/raw/he        # real H&E images for FID reference
  fid_batch_size: 50
  fid_dims: 2048                   # InceptionV3 feature dim
  struct_iou_threshold: 0.5        # IoU threshold for nuclei matching
